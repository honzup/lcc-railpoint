; LCC RailPoint (Fleet #4) -- WiFi-transport OpenLCB node on ESP32-S3 (XIAO S3).
; Connects as a GridConnect-TCP uplink client to the JMRI hub -- no CAN/TWAI.
; WiFi credentials are provisioned via a tzapu WiFiManager captive portal
; (lcc-railpoint-Setup), not hardcoded.
; Toolchain pinned like the sibling s3-can-spike / fleet projects:
;   arduino-esp32 = espressif32@6.9.0 (2.0.x), OpenMRNLite v2.0.0, gnu++17.
; BUILD ONLY -- flashing needs the XIAO-S3 BOOT-button manual download step.
[env:xiao_s3_wifi]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/openmrn/OpenMRNLite.git#v2.0.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = pre:patch_openmrnlite.py
upload_speed = 115200
