; LCC RailPoint (Fleet #4) -- WiFi-transport OpenLCB node on ESP32-S3 (XIAO S3).
; Connects as a GridConnect-TCP uplink client to the JMRI hub -- no CAN/TWAI.
; WiFi credentials are provisioned via a tzapu WiFiManager captive portal
; (lcc-railpoint-Setup), not hardcoded.
; Toolchain pinned like the sibling s3-can-spike / fleet projects:
;   arduino-esp32 = espressif32@6.9.0 (2.0.x), OpenMRNLite v2.0.0, gnu++17.
; BUILD ONLY -- flashing needs the XIAO-S3 BOOT-button manual download step.
[env:xiao_s3_wifi]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/openmrn/OpenMRNLite.git#v2.0.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = pre:patch_openmrnlite.py
; NOTE: PlatformIO 6.9.0 bundles esptool 4.5.1, which has an ESP32-S3
; USB-Serial-JTAG stub-drop bug ("no serial data received" after the stub) ->
; USB flashing needs the manual BOOT-button download-mode dance. arduino-cli's
; newer esptool doesn't have this. FIX PATH: after the first flash, use WiFi OTA
; (ArduinoOTA) so USB is never needed again; or upgrade tool-esptoolpy.

; OTA env for all flashes after the first USB one. ArduinoOTA runs with its
; own mDNS disabled (Esp32WiFiManager already owns mDNS -- see main.cpp), so
; espota must target the node's current IP directly, not its hostname.
; upload_port is left commented -- the node's IP is DHCP-assigned and can
; drift; set it to the current IP below, or pass --upload-port explicitly
; (e.g. `pio run -e xiao_s3_wifi_ota -t upload --upload-port <ip>`).
[env:xiao_s3_wifi_ota]
extends = env:xiao_s3_wifi
upload_protocol = espota
; upload_port = 192.168.1.242
